name: CI - Build DB Inventory DEV

on:
  push:
    branches:
      - develop

    paths:
      - "apps/**"
      - ".github/workflows/ci-build.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - app: dbapp
            context: apps/dbapp
            tag: dbapp

          - app: front
            context: apps/front
            tag: dbinventory-front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            socaninfsupport/private:${{ matrix.tag }}-develop
            socaninfsupport/private:${{ matrix.tag }}-${{ github.sha }}
