apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbinventory-front
spec:
  replicas: 1

  selector:
    matchLabels:
      app: dbinventory-front

  template:
    metadata:
      labels:
        app: dbinventory-front

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      imagePullSecrets:
        - name: dockerhub-regcred

      containers:
        - name: front
          image: devops-dbinventory-front
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL

          env:
            - name: HOSTNAME
              value: "0.0.0.0"

          ports:
            - containerPort: 3000
